data_path: data/processed/cdc_events_200k_from_oct2019.csv
target: priority_label
categorical_columns:
  - event_type
  - table_name
  - business_domain
  - source_service
  - user_level
numeric_columns:
  - record_size
  - changed_columns_count
  - estimated_sync_cost
  - business_value
  - consistency_risk
  - dependency_count
  - queue_wait_time
  - deadline
  - retry_count
  - source_load
  - db_load
  - is_peak_hour
  - is_hot_data
split:
  train: 0.7
  valid: 0.15
  test: 0.15
labeling:
  impact_score:
    components:
      deadline_miss_impact:
        weight: 0.35
        mode: deadline_risk
        params:
          pressure_threshold: 0.85
          sigmoid_scale: 6.0
          retry_boost: 0.25
          peak_hour_boost: 0.10
          load_boost: 0.20
      delay_cost_impact:
        weight: 0.25
        mode: delay_cost
        params:
          delay_threshold: 0.45
          delay_scale: 5.0
          business_value_boost: 0.30
      consistency_impact:
        weight: 0.20
        mode: consistency_risk
        numeric_weights:
          consistency_risk: 0.45
          dependency_count: 0.35
        categorical_weights:
          event_type: 0.10
          table_name: 0.05
          source_service: 0.05
        hot_values:
          event_type:
            - PURCHASE
            - CART
          table_name:
            - ORDERS
            - PAYMENTS
            - INVENTORY
        interactions:
          - columns:
              - event_type
              - table_name
            hot_values:
              event_type:
                - PURCHASE
                - CART
              table_name:
                - ORDERS
                - PAYMENTS
            weight: 0.15
      starvation_externality:
        weight: 0.10
        mode: fairness_cost
        hot_values:
          business_domain:
            - ARCHIVE
            - ANALYTICS
          user_level:
            - NORMAL
            - GUEST
        params:
          low_priority_boost: 0.50
          peak_hour_boost: 0.20
      throughput_value:
        weight: 0.10
        mode: business_value
        numeric_weights:
          business_value: 0.70
        categorical_weights:
          user_level: 0.20
          business_domain: 0.10
        hot_values:
          user_level:
            - VIP
            - INTERNAL
          business_domain:
            - ELECTRONICS
            - COMPUTERS
            - APPLIANCES
    thresholds:
      strategy: quantile
      low_high_quantiles:
        - 0.33
        - 0.66
